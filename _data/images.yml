  - src: hero/01-amtrack.jpg
    position: "center 70%"
  - src: hero/02-abasiri.jpg       # 網走（元 PNG 11MB を 2000px JPEG に圧縮）
    position: "center 45%"
  - src: hero/03-wadabori.jpg      # 和田堀（同上）
    position: "center 60%"

# 業績ページのヘッダー帯（1枚）
